version: '3.8'

services:
  # RAG Service - Vector search and LLM grounding
  rag-service:
    build:
      context: .
      dockerfile: src/services/rag/Dockerfile
    container_name: rag-service
    ports:
      - "8000:8000"
    environment:
      - PYTHONUNBUFFERED=1
      - EMBEDDING_SERVICE_URL=${EMBEDDING_SERVICE_URL:-http://embeddings.192-168-1-3.nip.io}
      - GCP_PROJECT_ID=${GCP_PROJECT_ID:-rapporteurclients}
      - PROJECT_ID=${GCP_PROJECT_ID:-rapporteurclients}
      - GCP_LOCATION=${GCP_LOCATION:-us-central1}
      - LOCATION=${GCP_LOCATION:-us-central1}
      - GOOGLE_APPLICATION_CREDENTIALS=/home/electric/.config/gcp-keys/rapporteur-sa.json
      - KAFKA_BOOTSTRAP_SERVERS=${KAFKA_BOOTSTRAP_SERVERS:-kafka:29092}
    volumes:
      # Mount src for development
      - ./src:/app/src
      # Mount index file from project root (using filtered version)
      - ./research_summaries_filtered.jsonl:/app/research_summaries_with_embeddings_combined.jsonl
      # Mount QA index file for enriched grounding (using filtered version)
      - ./research_qa_pairs_filtered.jsonl:/app/research_qa_pairs_with_embeddings_combined.jsonl
      # Mount logs
      - ./src/services/logs:/app/src/services/logs
      # Mount GCP credentials
      - /home/electric/.config/gcp-keys/rapporteur-sa.json://home/electric/.config/gcp-keys/rapporteur-sa.json:ro
    networks:
      - services-network
      - rapporteur_app_kafka-network
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s

  # Frontend Service - Web UI for RAG queries
  frontend-service:
    build:
      context: .
      dockerfile: src/services/frontend/Dockerfile
    container_name: frontend-service
    ports:
      - "5001:5000"
    environment:
      - PYTHONUNBUFFERED=1
      - RAG_SERVICE_URL=http://rag-service:8000
      - KAFKA_BOOTSTRAP_SERVERS=${KAFKA_BOOTSTRAP_SERVERS:-kafka:29092}
    volumes:
      # Mount frontend files for development
      - ./src/services/frontend:/app/src/services/frontend
      # Mount logs
      - ./src/services/logs:/app/src/services/logs
    networks:
      - services-network
      - rapporteur_app_kafka-network
    depends_on:
      rag-service:
        condition: service_healthy
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:5000/api/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 20s

networks:
  services-network:
    driver: bridge
  rapporteur_app_kafka-network:
    external: true
