# Prometheus configuration for Kafka consumers telemetry
global:
  scrape_interval: 15s
  evaluation_interval: 15s
  external_labels:
    cluster: 'local-dev'
    environment: 'development'

# Scrape configurations
scrape_configs:
  # Kafka Web Scraper Consumer
  - job_name: 'kafka_web_scraper'
    static_configs:
      - targets: ['172.19.0.1:8001']
        labels:
          consumer: 'web_scraper'
          service: 'kafka_consumer'
    metrics_path: '/metrics'
    scrape_interval: 10s
    scrape_timeout: 5s

  # Document Chunker Consumer
  - job_name: 'kafka_document_chunker'
    static_configs:
      - targets: ['172.19.0.1:8002']
        labels:
          consumer: 'document_chunker'
          service: 'kafka_consumer'
    metrics_path: '/metrics'
    scrape_interval: 10s
    scrape_timeout: 5s

  # Chunk Embedder Consumer
  - job_name: 'kafka_chunk_embedder'
    static_configs:
      - targets: ['172.19.0.1:8003']
        labels:
          consumer: 'chunk_embedder'
          service: 'kafka_consumer'
    metrics_path: '/metrics'
    scrape_interval: 10s
    scrape_timeout: 5s

  # Q&A Generator Consumer
  - job_name: 'kafka_qa_generator'
    static_configs:
      - targets: ['172.19.0.1:8004']
        labels:
          consumer: 'qa_generator'
          service: 'kafka_consumer'
    metrics_path: '/metrics'
    scrape_interval: 10s
    scrape_timeout: 5s

  # Q&A Embedder Consumer
  - job_name: 'kafka_qa_embedder'
    static_configs:
      - targets: ['172.19.0.1:8005']
        labels:
          consumer: 'qa_embedder'
          service: 'kafka_consumer'
    metrics_path: '/metrics'
    scrape_interval: 10s
    scrape_timeout: 5s

  # Summarizer Consumer
  - job_name: 'kafka_summarizer'
    static_configs:
      - targets: ['172.19.0.1:8010']
        labels:
          consumer: 'summarizer'
          service: 'kafka_consumer'
    metrics_path: '/metrics'
    scrape_interval: 10s
    scrape_timeout: 5s

  # Summary Indexer Consumer
  - job_name: 'kafka_summary_indexer'
    static_configs:
      - targets: ['172.19.0.1:8006']
        labels:
          consumer: 'summary_indexer'
          service: 'kafka_consumer'
    metrics_path: '/metrics'
    scrape_interval: 10s
    scrape_timeout: 5s

  # Citation Extractor Consumer
  - job_name: 'kafka_citation_extractor'
    static_configs:
      - targets: ['172.19.0.1:8007']
        labels:
          consumer: 'citation_extractor'
          service: 'kafka_consumer'
    metrics_path: '/metrics'
    scrape_interval: 10s
    scrape_timeout: 5s

  # Index Aggregator Consumer
  - job_name: 'kafka_index_aggregator'
    static_configs:
      - targets: ['172.19.0.1:8008']
        labels:
          consumer: 'index_aggregator'
          service: 'kafka_consumer'
    metrics_path: '/metrics'
    scrape_interval: 10s
    scrape_timeout: 5s

  # Dead Letter Consumer
  - job_name: 'kafka_dead_letter_consumer'
    static_configs:
      - targets: ['172.19.0.1:8009']
        labels:
          consumer: 'dead_letter'
          service: 'kafka_consumer'
    metrics_path: '/metrics'
    scrape_interval: 10s
    scrape_timeout: 5s

  # Prometheus self-monitoring
  - job_name: 'prometheus'
    static_configs:
      - targets: ['localhost:9090']
