[tools.isort]
profile = "black"
skip_gitignore = true
known_first_party = [
    "service"
]

[tool.pytest.ini_options]
env_files = ["tests/.env"]
python_files = ["test_*.py", "*_tests.py"]
testpaths = ["tests"]
timeout = 30

[tool.coverage.run]
branch = true
source = ["."]
omit = [
    "tests/**"
]

[tool.coverage.report]
fail_under = 0
show_missing = true
sort = "miss"
