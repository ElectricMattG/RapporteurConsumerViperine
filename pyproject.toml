[tools.isort]
profile = "black"
skip_gitignore = true
known_first_party = [
    "service"
]

[tool.pytest.ini_options]
env_files = ["tests/.env"]
python_files = ["test_*.py", "*_tests.py"]
testpaths = ["tests"]
timeout = 30
pythonpath = [".", "src", "src/clients", "src/consumers", "src/utils"]
addopts = ["--tb=short"]
markers = [
    "regression: story-mandated invariant tests (run with: pytest -m regression)",
]
filterwarnings = [
    "ignore::DeprecationWarning:pythonjsonlogger.*",
]

[tool.coverage.run]
branch = true
source = ["src"]
omit = [
    "tests/**",
    "src/consumers/run_*.py",
]

[tool.coverage.report]
fail_under = 0
show_missing = true
sort = "miss"
exclude_lines = [
    "pragma: no cover",
    "if __name__ == .__main__.:",
    "def start\\(",
    "def main\\(",
]
