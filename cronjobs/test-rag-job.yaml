apiVersion: batch/v1
kind: Job
metadata:
  name: test-rag-call
  namespace: consumers
spec:
  ttlSecondsAfterFinished: 300
  template:
    spec:
      restartPolicy: Never
      containers:
      - name: test
        image: python:3.12-slim
        command:
        - /bin/bash
        - -c
        - |
          pip install requests urllib3 -q
          cat << 'PYEOF' | python3
          import requests
          import urllib3
          import json

          urllib3.disable_warnings(urllib3.exceptions.InsecureRequestWarning)

          RAG_API_URL = 'https://rag.rapporteur.ai/query'
          RAG_API_KEY = '32d160f623efa11ebd88d34ca0b9f4093eb1f866a640d4b70b0fbafb6c22e398'

          print('=' * 80)
          print('Testing RAG API Call from Kubernetes Cluster')
          print('=' * 80)
          print(f'URL: {RAG_API_URL}')
          print('=' * 80)

          test_query = 'Get the latest news from the Israeli Ministry of Defense from 2023-09-01 to 2023-09-15'

          headers = {
              'Content-Type': 'application/json',
              'Host': 'rag.rapporteur.ai',
              'X-API-Key': RAG_API_KEY
          }

          payload = {
              'query': test_query,
              'processing_mode': 'research',
              'enable_query_refinement': False,
              'top_k': 3
          }

          print(f'Query: {test_query}')
          print(f'Processing mode: research')
          print(f'Top K: 3\n')

          try:
              response = requests.post(
                  RAG_API_URL,
                  headers=headers,
                  json=payload,
                  timeout=180,
                  verify=False
              )

              print(f'Status Code: {response.status_code}')

              if response.status_code == 200:
                  result = response.json()
                  print('\n✅ Success!')
                  print(f"Session ID: {result.get('session_id', 'N/A')}")
                  print(f"Request ID: {result.get('request_id', 'N/A')}")

                  grounding = result.get('grounding_metadata', {})
                  citations = grounding.get('citations', [])
                  print(f'Citations found: {len(citations)}')

                  if citations:
                      print('\nFirst 5 citations:')
                      for i, citation in enumerate(citations[:5], 1):
                          print(f"  {i}. {citation.get('title', 'No title')}")
                          print(f"     URL: {citation.get('uri', 'No URL')}")
              else:
                  print(f'\n❌ Error: HTTP {response.status_code}')
                  print(f'Response: {response.text[:1000]}')

          except Exception as e:
              print(f'\n❌ Request failed: {e}')
              import traceback
              traceback.print_exc()
          PYEOF
