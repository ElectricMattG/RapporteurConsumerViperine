apiVersion: v1
kind: Namespace
metadata:
  name: rag-frontend
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: rag-frontend-cache
  namespace: rag-frontend
spec:
  accessModes:
    - ReadWriteOnce
  storageClassName: managed-csi
  resources:
    requests:
      storage: 10Gi
---
apiVersion: v1
kind: Secret
metadata:
  name: rag-frontend-auth
  namespace: rag-frontend
type: Opaque
stringData:
  auth: |
    # htpasswd format: username:hashed_password
    # Generate with: htpasswd -nb username password
    # Default: admin:admin (change this!)
    admin:$apr1$H6uskkkW$IgXLP6ewTrSuBkTrqE8wj.
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: rag-frontend
  namespace: rag-frontend
  labels:
    app: rag-frontend
spec:
  replicas: 1
  selector:
    matchLabels:
      app: rag-frontend
  template:
    metadata:
      labels:
        app: rag-frontend
    spec:
      nodeSelector:
        workload: frontend
      tolerations:
      - key: workload
        operator: Equal
        value: frontend
        effect: NoSchedule
      containers:
      - name: rag-frontend
        image: ragserviceneacr6881.azurecr.io/rag-frontend:latest
        imagePullPolicy: Always
        ports:
        - containerPort: 9066
          name: http
        env:
        - name: PORT
          value: "9066"
        - name: RAG_SERVICE_URL
          value: "http://rag-service.rag-service.svc.cluster.local:8000"
        resources:
          requests:
            memory: "512Mi"
            cpu: "500m"
          limits:
            memory: "2Gi"
            cpu: "2000m"
        volumeMounts:
        - name: cache
          mountPath: /app/cache
        livenessProbe:
          httpGet:
            path: /
            port: 9066
          initialDelaySeconds: 30
          periodSeconds: 10
          timeoutSeconds: 5
        readinessProbe:
          httpGet:
            path: /
            port: 9066
          initialDelaySeconds: 10
          periodSeconds: 5
          timeoutSeconds: 3
      volumes:
      - name: cache
        persistentVolumeClaim:
          claimName: rag-frontend-cache
---
apiVersion: v1
kind: Service
metadata:
  name: rag-frontend
  namespace: rag-frontend
  labels:
    app: rag-frontend
spec:
  type: ClusterIP
  ports:
  - port: 80
    targetPort: 9066
    protocol: TCP
    name: http
  selector:
    app: rag-frontend
---
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: rag-frontend
  namespace: rag-frontend
  annotations:
    nginx.ingress.kubernetes.io/auth-type: basic
    nginx.ingress.kubernetes.io/auth-secret: rag-frontend-auth
    nginx.ingress.kubernetes.io/auth-realm: 'RAG Frontend - Authentication Required'
    nginx.ingress.kubernetes.io/ssl-redirect: "true"
    nginx.ingress.kubernetes.io/proxy-connect-timeout: "300"
    nginx.ingress.kubernetes.io/proxy-send-timeout: "300"
    nginx.ingress.kubernetes.io/proxy-read-timeout: "300"
    nginx.ingress.kubernetes.io/proxy-body-size: "10m"
    cert-manager.io/cluster-issuer: letsencrypt-prod
spec:
  ingressClassName: nginx
  tls:
  - hosts:
    - rag-frontend.rapporteur.ai
    secretName: rag-frontend-tls
  rules:
  - host: rag-frontend.rapporteur.ai
    http:
      paths:
      - path: /
        pathType: Prefix
        backend:
          service:
            name: rag-frontend
            port:
              number: 80
