apiVersion: batch/v1
kind: Job
metadata:
  name: send-test-urls
  namespace: consumers
spec:
  ttlSecondsAfterFinished: 3600  # Keep job for 1 hour after completion
  template:
    spec:
      restartPolicy: Never
      containers:
      - name: url-sender
        image: ragserviceneacr6881.azurecr.io/scrape-consumer:latest
        command: ["python3", "/app/send_urls.py"]
        env:
        - name: KAFKA_BOOTSTRAP_SERVERS
          value: "kafka-direct-0.kafka-direct-headless.kafka.svc.cluster.local:9092"
        volumeMounts:
        - name: send-urls-script
          mountPath: /app/send_urls.py
          subPath: send_urls.py
      volumes:
      - name: send-urls-script
        configMap:
          name: send-urls-script
      imagePullSecrets:
      - name: acr-secret
