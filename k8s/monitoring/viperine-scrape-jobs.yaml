# Canonical Viperine Consumer Scrape Jobs
# ──────────────────────────────────────────────────────────────────────────────
# Merged into the cluster prometheus-config ConfigMap by deploy_cluster_monitoring.sh.
# Target DNS: <service>.<namespace>.svc.cluster.local:<metricsPort>
#
# Label contract:
#   consumer: short consumer name (matches Helm role)
#   pipeline: "viperine" (isolates from kaliya/lamia/bboa)
#   service:  "kafka_consumer" (shared Grafana datasource filter)
#
# Port source of truth: helm/rapporteur-consumer-group/values.yaml → consumers.<role>.metricsPort
# ──────────────────────────────────────────────────────────────────────────────

- job_name: 'viperine_web_scraper'
  metrics_path: '/metrics'
  scrape_interval: 10s
  static_configs:
    - targets: ['viperine-web-scraper.consumers.svc.cluster.local:8001']
      labels:
        consumer: 'web_scraper'
        pipeline: 'viperine'
        service: 'kafka_consumer'

