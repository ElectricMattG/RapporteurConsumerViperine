---
# Web Scraper Service
apiVersion: v1
kind: Service
metadata:
  name: web-scraper
  namespace: consumers
  labels:
    app: web-scraper
    component: consumer
    metrics: "true"
spec:
  type: ClusterIP
  ports:
  - port: 8001
    targetPort: 8001
    protocol: TCP
    name: metrics
  selector:
    app: web-scraper

