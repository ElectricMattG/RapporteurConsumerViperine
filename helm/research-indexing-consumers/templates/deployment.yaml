{{- range $name, $config := .Values.consumers }}
{{- if $config.enabled }}
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ $name | kebabcase }}
  labels:
    app: {{ $name | kebabcase }}
    component: kafka-consumer
spec:
  replicas: {{ $config.replicas }}
  selector:
    matchLabels:
      app: {{ $name | kebabcase }}
  template:
    metadata:
      labels:
        app: {{ $name | kebabcase }}
        component: kafka-consumer
    spec:
      imagePullSecrets:
      - name: acr-secret
      nodeSelector:
        {{- toYaml $.Values.nodeSelector | nindent 8 }}
      tolerations:
        {{- toYaml $.Values.tolerations | nindent 8 }}
      containers:
      - name: consumer
        image: {{ $.Values.image.registry }}/{{ $.Values.image.repository }}:{{ $.Values.image.tag }}
        imagePullPolicy: {{ $.Values.image.pullPolicy }}
        command:
          {{- toYaml $config.command | nindent 10 }}
        env:
        - name: KAFKA_BOOTSTRAP_SERVERS
          value: {{ $.Values.kafka.bootstrapServers }}
        {{- if $.Values.gcpCredentials.enabled }}
        - name: GOOGLE_APPLICATION_CREDENTIALS
          value: {{ $.Values.gcpCredentials.mountPath }}/credentials.json
        {{- end }}
        {{- if $.Values.azureStorage.enabled }}
        - name: AZURE_STORAGE_CONNECTION_STRING
          valueFrom:
            secretKeyRef:
              name: {{ $.Values.azureStorage.secretName }}
              key: connection-string
        - name: AZURE_INDICES_CONTAINER
          value: {{ $.Values.azureStorage.containerNames.indices }}
        - name: AZURE_ARCHIVE_CONTAINER
          value: {{ $.Values.azureStorage.containerNames.archive }}
        - name: AZURE_SESSION_BACKUPS_CONTAINER
          value: {{ $.Values.azureStorage.containerNames.sessionBackups }}
        {{- end }}
        {{- if $config.env }}
        {{- toYaml $config.env | nindent 8 }}
        {{- end }}
        resources:
          {{- toYaml $config.resources | nindent 10 }}
        volumeMounts:
        - name: cache
          mountPath: /app/cache
        {{- if $.Values.gcpCredentials.enabled }}
        - name: gcp-credentials
          mountPath: {{ $.Values.gcpCredentials.mountPath }}
          readOnly: true
        {{- end }}
      volumes:
      - name: cache
        {{- if $.Values.persistence.enabled }}
        persistentVolumeClaim:
          claimName: {{ $.Values.persistence.name }}
        {{- else }}
        emptyDir: {}
        {{- end }}
      {{- if $.Values.gcpCredentials.enabled }}
      - name: gcp-credentials
        secret:
          secretName: {{ $.Values.gcpCredentials.secretName }}
      {{- end }}
{{- end }}
{{- end }}
