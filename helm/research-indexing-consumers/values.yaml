image:
  registry: ragserviceneacr6881.azurecr.io
  repository: scrape-consumer
  tag: latest
  pullPolicy: Always

kafka:
  bootstrapServers: kafka.kafka.svc.cluster.local:9092

persistence:
  enabled: true
  name: consumers-shared-cache
  storageClass: azurefile
  size: 50Gi

gcpCredentials:
  enabled: true
  secretName: gcp-service-account
  # Secret should contain 'credentials.json' key with GCP service account JSON
  mountPath: /var/secrets/google

azureStorage:
  enabled: true
  secretName: azure-storage-secret
  # Secret should contain 'connection-string' key with Azure Storage connection string
  containerNames:
    indices: indices
    archive: research-archive
    sessionBackups: session-backups

nodeSelector:
  agentpool: ridxpool

tolerations:
  - key: workload
    operator: Equal
    value: research-indexing
    effect: NoSchedule

consumers:
  webScraper:
    enabled: true
    replicas: 2
    command: ["python", "-u", "src/consumers/run_kafka_consumer.py"]
    resources:
      requests:
        cpu: 400m
        memory: 1200Mi
      limits:
        cpu: 1000m
        memory: 3Gi
    env:
      - name: CONSUMER_TYPE
        value: "web_scraper"

  documentChunker:
    enabled: true
    replicas: 1
    command: ["python", "-u", "src/consumers/run_kafka_chunker.py"]
    resources:
      requests:
        cpu: 400m
        memory: 200Mi
      limits:
        cpu: 1000m
        memory: 1Gi

  chunkEmbedder:
    enabled: true
    replicas: 1
    command: ["python", "-u", "src/consumers/run_kafka_chunk_embedder.py"]
    resources:
      requests:
        cpu: 400m
        memory: 200Mi
      limits:
        cpu: 1000m
        memory: 1Gi

  citationExtractor:
    enabled: true
    replicas: 1
    command: ["python", "-u", "src/consumers/run_kafka_citation_extractor.py"]
    resources:
      requests:
        cpu: 400m
        memory: 150Mi
      limits:
        cpu: 1000m
        memory: 512Mi

  qaGenerator:
    enabled: true
    replicas: 2
    command: ["python", "-u", "src/consumers/run_kafka_qa_generator.py"]
    resources:
      requests:
        cpu: 400m
        memory: 300Mi
      limits:
        cpu: 1000m
        memory: 1Gi
    env:
      - name: PROJECT_ID
        value: "another-project-472212"
      - name: LOCATION
        value: "us-central1"

  qaEmbedder:
    enabled: true
    replicas: 3
    command: ["python", "-u", "src/consumers/run_kafka_qa_embedder.py"]
    resources:
      requests:
        cpu: 400m
        memory: 200Mi
      limits:
        cpu: 1000m
        memory: 1Gi

  summarizer:
    enabled: true
    replicas: 3
    command: ["python", "-u", "src/consumers/run_kafka_summarizer.py"]
    resources:
      requests:
        cpu: 400m
        memory: 250Mi
      limits:
        cpu: 1000m
        memory: 1Gi
    env:
      - name: PROJECT_ID
        value: "another-project-472212"
      - name: LOCATION
        value: "us-central1"

  indexAggregator:
    enabled: true
    replicas: 1
    command: ["python", "-u", "src/consumers/run_kafka_index_aggregator.py"]
    resources:
      requests:
        cpu: 400m
        memory: 700Mi
      limits:
        cpu: 1000m
        memory: 2Gi

  deadLetterConsumer:
    enabled: false
    replicas: 1
    command: ["python", "-u", "src/consumers/run_kafka_dead_letter_consumer.py"]
    resources:
      requests:
        cpu: 400m
        memory: 2500Mi
      limits:
        cpu: 1000m
        memory: 6Gi
