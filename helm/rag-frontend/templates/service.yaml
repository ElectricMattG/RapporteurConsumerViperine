apiVersion: v1
kind: Service
metadata:
  name: {{ include "rag-frontend.fullname" . }}
  labels:
    {{- include "rag-frontend.labels" . | nindent 4 }}
spec:
  type: {{ .Values.service.type }}
  {{- if .Values.service.sessionAffinity }}
  sessionAffinity: {{ .Values.service.sessionAffinity }}
  {{- end }}
  ports:
  - port: {{ .Values.service.port }}
    targetPort: {{ .Values.service.targetPort }}
    protocol: TCP
    name: http
  selector:
    {{- include "rag-frontend.selectorLabels" . | nindent 4 }}
