{{- if .Values.serviceAccount.create -}}
apiVersion: v1
kind: ServiceAccount
metadata:
  name: {{ include "rag-frontend.serviceAccountName" . }}
  labels:
    {{- include "rag-frontend.labels" . | nindent 4 }}
  {{- with .Values.serviceAccount.annotations }}
  annotations:
    {{- toYaml . | nindent 4 }}
  {{- end }}
  {{- if .Values.gcpServiceAccount.workloadIdentity.enabled }}
  annotations:
    iam.gke.io/gcp-service-account: {{ .Values.gcpServiceAccount.workloadIdentity.serviceAccount }}
  {{- end }}
{{- end }}
