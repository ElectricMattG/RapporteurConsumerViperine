apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ include "rag-frontend.fullname" . }}
  labels:
    {{- include "rag-frontend.labels" . | nindent 4 }}
data:
  EMBEDDING_SERVICE_URL: {{ .Values.config.embeddingServiceUrl | quote }}
  EMBEDDING_SERVICE_API_KEY: {{ .Values.config.embeddingServiceApiKey | quote }}
  LOCATION: {{ .Values.config.gcpLocation | quote }}
  LOG_LEVEL: {{ .Values.config.logLevel | quote }}
  PYTHONUNBUFFERED: {{ .Values.config.pythonUnbuffered | quote }}
  {{- if .Values.config.llmModel }}
  LLM_MODEL: {{ .Values.config.llmModel | quote }}
  {{- end }}
  {{- if .Values.config.reasoningEffort }}
  REASONING_EFFORT: {{ .Values.config.reasoningEffort | quote }}
  {{- end }}
  {{- if .Values.config.maxContextChars }}
  MAX_CONTEXT_CHARS: {{ .Values.config.maxContextChars | quote }}
  {{- end }}
