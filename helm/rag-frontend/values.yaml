# Default values for rag-frontend Helm chart
# This is a YAML-formatted file.
# Declare variables to be passed into your templates.

replicaCount: 1

image:
  registry: ragserviceneacr6881.azurecr.io
  repository: rag-frontend
  pullPolicy: Always
  tag: "latest"

imagePullSecrets:
  - name: acr-secret
nameOverride: ""
fullnameOverride: ""

serviceAccount:
  create: true
  annotations: {}
  name: ""

podAnnotations: {}

podSecurityContext:
  fsGroup: 1000

securityContext:
  capabilities:
    drop:
    - ALL
  readOnlyRootFilesystem: false
  runAsNonRoot: true
  runAsUser: 1000

service:
  type: ClusterIP
  port: 80
  targetPort: http
  sessionAffinity: ClientIP

ingress:
  enabled: true
  className: "nginx"
  annotations:
    nginx.ingress.kubernetes.io/ssl-redirect: "true"
    nginx.ingress.kubernetes.io/proxy-connect-timeout: "600"
    nginx.ingress.kubernetes.io/proxy-send-timeout: "600"
    nginx.ingress.kubernetes.io/proxy-read-timeout: "600"
    nginx.ingress.kubernetes.io/proxy-body-size: "50m"
    nginx.ingress.kubernetes.io/proxy-buffer-size: "16k"
    nginx.ingress.kubernetes.io/proxy-buffers-number: "8"
    nginx.ingress.kubernetes.io/proxy-busy-buffers-size: "32k"
    cert-manager.io/cluster-issuer: letsencrypt-prod
  hosts:
    - host: portal.rapporteur.ai
      paths:
        - path: /
          pathType: Prefix
  tls:
    - secretName: rag-frontend-tls
      hosts:
        - portal.rapporteur.ai

resources:
  limits:
    cpu: 2000m
    memory: 4Gi
  requests:
    cpu: 500m
    memory: 1Gi

autoscaling:
  enabled: false
  minReplicas: 1
  maxReplicas: 3
  targetCPUUtilizationPercentage: 70
  targetMemoryUtilizationPercentage: 80

nodeSelector:
  workload: frontend

tolerations:
  - key: workload
    operator: Equal
    value: frontend
    effect: NoSchedule

affinity: {}

# Persistent Volume Claims
persistence:
  cache:
    enabled: true
    storageClass: "managed-csi"
    accessMode: ReadWriteOnce
    size: 10Gi
  logs:
    enabled: false

# Health check probes
livenessProbe:
  httpGet:
    path: /
    port: http
  initialDelaySeconds: 30
  periodSeconds: 30
  timeoutSeconds: 10
  failureThreshold: 6

readinessProbe:
  httpGet:
    path: /
    port: http
  initialDelaySeconds: 10
  periodSeconds: 5
  timeoutSeconds: 3
  failureThreshold: 3

startupProbe:
  httpGet:
    path: /
    port: http
  initialDelaySeconds: 5
  periodSeconds: 5
  timeoutSeconds: 3
  failureThreshold: 10

# Application configuration
config:
  port: "9066"
  ragServiceUrl: "http://rag-service.rag-service.svc.cluster.local:8000"

# Basic auth secret
# Generate with: htpasswd -nb username password
auth:
  enabled: true
  # Default: admin:admin (CHANGE THIS!)
  htpasswd: "admin:$apr1$PnNLF4nO$SEuoYFA2nTQTZxnKSokBV."

# GCP Service Account (not used for frontend, but required by template)
gcpServiceAccount:
  enabled: false
  workloadIdentity:
    enabled: false
