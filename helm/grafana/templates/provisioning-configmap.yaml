apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ include "grafana.fullname" . }}-provisioning
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "grafana.labels" . | nindent 4 }}
data:
  dashboards.yml: |
{{ .Files.Get "provisioning/dashboards/dashboards.yml" | indent 4 }}
  datasources.yml: |
{{ .Files.Get "provisioning/datasources/prometheus.yml" | indent 4 }}
