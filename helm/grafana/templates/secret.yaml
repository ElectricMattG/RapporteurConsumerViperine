apiVersion: v1
kind: Secret
metadata:
  name: {{ include "grafana.fullname" . }}-credentials
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "grafana.labels" . | nindent 4 }}
type: Opaque
stringData:
  admin-user: {{ .Values.adminUser }}
  admin-password: {{ .Values.adminPassword }}
