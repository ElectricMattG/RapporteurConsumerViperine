replicaCount: 1

image:
  repository: prom/prometheus
  tag: v2.48.0
  pullPolicy: IfNotPresent

nodeSelector:
  workload: monitoring

resources:
  requests:
    memory: "512Mi"
    cpu: "250m"
  limits:
    memory: "1Gi"
    cpu: "500m"

persistence:
  enabled: true
  storageClass: "managed-csi"
  size: 50Gi
  accessMode: ReadWriteOnce

retention:
  time: 30d

service:
  type: ClusterIP
  port: 9090

ingress:
  enabled: true
  className: nginx
  host: prometheus.rapporteur.ai
  annotations: {}
  tls:
    enabled: true
    clusterIssuer: letsencrypt-prod
  auth:
    enabled: true
    secretName: prometheus-basic-auth
    username: admin
    password: changeme123  # Change in production!

scrapeInterval: 10s
evaluationInterval: 10s

# External labels for all metrics
externalLabels:
  cluster: 'embedding-aks-ne'
  environment: 'production'

# Kafka consumers to scrape
# Configured for K8s services in 'consumers' namespace
kafkaConsumers:
  - name: web_scraper
    target: 'web-scraper.consumers.svc.cluster.local:8001'
    port: 8001

  - name: document_chunker
    target: 'document-chunker.consumers.svc.cluster.local:8002'
    port: 8002

  - name: chunk_embedder
    target: 'chunk-embedder.consumers.svc.cluster.local:8003'
    port: 8003

  - name: qa_generator
    target: 'qa-generator.consumers.svc.cluster.local:8004'
    port: 8004

  - name: qa_embedder
    target: 'qa-embedder.consumers.svc.cluster.local:8005'
    port: 8005

  - name: summarizer
    target: 'summarizer.consumers.svc.cluster.local:8006'
    port: 8006

  - name: citation_extractor
    target: 'citation-extractor.consumers.svc.cluster.local:8007'
    port: 8007

  - name: index_aggregator
    target: 'index-aggregator.consumers.svc.cluster.local:8008'
    port: 8008

  - name: dead_letter
    target: 'dead-letter.consumers.svc.cluster.local:8009'
    port: 8009
