apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ include "prometheus.fullname" . }}-config
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "prometheus.labels" . | nindent 4 }}
data:
  prometheus.yml: |
    global:
      scrape_interval: {{ .Values.scrapeInterval }}
      evaluation_interval: {{ .Values.evaluationInterval }}
      external_labels:
        {{- toYaml .Values.externalLabels | nindent 8 }}

    scrape_configs:
      {{- range .Values.kafkaConsumers }}
      - job_name: 'kafka_{{ .name }}'
        static_configs:
          - targets: ['{{ .target }}']
            labels:
              consumer: '{{ .name }}'
              service: 'kafka_consumer'
      {{- end }}
