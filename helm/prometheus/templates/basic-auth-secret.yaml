{{- if and .Values.ingress.enabled .Values.ingress.auth.enabled }}
apiVersion: v1
kind: Secret
metadata:
  name: {{ .Values.ingress.auth.secretName }}
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "prometheus.labels" . | nindent 4 }}
type: Opaque
data:
  auth: {{ htpasswd .Values.ingress.auth.username .Values.ingress.auth.password | b64enc }}
{{- end }}
