apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ include "rapporteur-consumer-group.fullname" . }}-alerts
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "rapporteur-consumer-group.labels" . | nindent 4 }}
    grafana_alert: "true"
data:
  viperine-alerts.yml: |
    groups:
      - name: viperine.consumers
        rules:

          # ── Availability ────────────────────────────────────────────────
          - alert: ViperineConsumerDown
            expr: kafka_consumer_state{pipeline="viperine"} != 1
            for: 2m
            labels:
              severity: critical
              pipeline: viperine
            annotations:
              summary: "Viperine consumer {{ $labels.consumer_id }} is not running"
              description: "Consumer state is {{ $value }} (expected 1=running). Check pod logs."

          - alert: ViperineConsumerStalled
            expr: (time() - kafka_consumer_last_successful_poll_timestamp{pipeline="viperine"}) > 300
            for: 5m
            labels:
              severity: critical
              pipeline: viperine
            annotations:
              summary: "Viperine consumer {{ $labels.consumer_id }} has not polled Kafka for 5+ minutes"
              description: "Last successful poll was {{ $value | humanizeDuration }} ago."

          - alert: ViperineTargetMissing
            expr: up{job=~"viperine_.*"} == 0
            for: 2m
            labels:
              severity: critical
              pipeline: viperine
            annotations:
              summary: "Prometheus cannot reach Viperine consumer {{ $labels.job }}"
              description: "Scrape target {{ $labels.instance }} is unreachable."

          # ── Kafka lag ───────────────────────────────────────────────────
          - alert: ViperineHighConsumerLag
            expr: kafka_consumer_kafka_consumer_lag_messages{pipeline="viperine"} > 1000
            for: 10m
            labels:
              severity: warning
              pipeline: viperine
            annotations:
              summary: "Viperine consumer {{ $labels.consumer_id }} has high lag on {{ $labels.topic }}"
              description: "Lag is {{ $value }} messages (threshold: 1000)."

          # ── Errors ──────────────────────────────────────────────────────
          - alert: ViperineHighErrorRatio
            expr: >
              sum by (consumer_id) (rate(kafka_consumer_processing_failures_total{pipeline="viperine"}[5m]))
              /
              sum by (consumer_id) (rate(kafka_consumer_messages_consumed_total{pipeline="viperine"}[5m]))
              > 0.05
            for: 10m
            labels:
              severity: warning
              pipeline: viperine
            annotations:
              summary: "Viperine consumer {{ $labels.consumer_id }} error ratio > 5%"
              description: "{{ $value | humanizePercentage }} of messages are failing."

          # ── Dead-letter queue ───────────────────────────────────────────
          - alert: ViperineDLQGrowing
            expr: rate(kafka_consumer_dlq_messages_processed_total[15m]) > 0
            for: 15m
            labels:
              severity: warning
              pipeline: viperine
            annotations:
              summary: "Viperine dead-letter queue is receiving messages"
              description: "{{ $value | humanize }} DLQ messages/s over the last 15 minutes."

          # ── Duplicate document IDs ──────────────────────────────────────
          - alert: ViperineRogueDocIdProducer
            expr: increase(kafka_consumer_summary_id_scheme_total{scheme="doc"}[10m]) > 0
            for: 0m
            labels:
              severity: warning
              pipeline: viperine
            annotations:
              summary: "doc_<hash> document IDs appearing in summary-completed topic"
              description: >
                {{ $value }} new doc_<hash> records in the last 10 minutes.
                A foreign producer (possibly the kaliya consumer's bundled kafka_summarizer.py)
                is writing to the summary-completed topic. See VIPERINE_OBSERVABILITY_PLAN.md §B1.

          - alert: ViperineDuplicateDocIdSpike
            expr: increase(kafka_consumer_summary_duplicates_detected_total{match="document_id"}[10m]) > 5
            for: 0m
            labels:
              severity: warning
              pipeline: viperine
            annotations:
              summary: "Spike in document_id duplicates at the summary indexer"
              description: "{{ $value }} duplicate document_id collisions in 10 minutes."

          # ── LLM cost ────────────────────────────────────────────────────
          - alert: ViperineLLMCostSpike
            expr: rate(kafka_consumer_llm_estimated_cost_usd_total{pipeline="viperine"}[1h]) * 3600 > 1.0
            for: 1h
            labels:
              severity: warning
              pipeline: viperine
            annotations:
              summary: "Viperine summarizer LLM cost exceeds $1/hour"
              description: "Current hourly rate is ${{ $value | humanize }}."
