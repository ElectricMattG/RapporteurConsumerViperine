{{- range $name, $config := .Values.consumers }}
{{- /* keep in lockstep with deployment.yaml's baby-viper minimal-mode gate */}}
{{- if and $config.enabled (or (not $.Values.minimalMode) (has $name (list "webScraper" "deadLetterConsumer"))) }}
---
apiVersion: v1
kind: Service
metadata:
  name: {{ printf "%s-%s" $.Release.Name ($name | kebabcase) }}
  namespace: {{ $.Release.Namespace }}
  labels:
    app: {{ printf "%s-%s" $.Release.Name ($name | kebabcase) }}
    role: {{ $name | kebabcase }}
    consumer-group: {{ $.Release.Name }}
    component: kafka-consumer
    pipeline: viperine
    metrics: "true"
  annotations:
    prometheus.io/scrape: "true"
    prometheus.io/port: {{ $config.metricsPort | quote }}
    prometheus.io/path: "/metrics"
spec:
  type: ClusterIP
  ports:
  - name: metrics
    port: {{ $config.metricsPort }}
    targetPort: metrics
    protocol: TCP
  selector:
    app: {{ printf "%s-%s" $.Release.Name ($name | kebabcase) }}
{{- end }}
{{- end }}
