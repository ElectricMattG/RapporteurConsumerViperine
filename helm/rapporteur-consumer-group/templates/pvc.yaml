{{- if .Values.persistence.enabled }}
---
# Static PersistentVolume — hostPath on the single-node cluster.
# Pre-requisite: /mnt/workspace_2/viperine-cache must exist on the host
# (created by `make k8s_prereqs`).
apiVersion: v1
kind: PersistentVolume
metadata:
  name: {{ .Release.Name }}-cache-pv
  labels:
    consumer-group: {{ .Release.Name }}
spec:
  capacity:
    storage: {{ .Values.persistence.size }}
  accessModes: [ReadWriteMany]
  persistentVolumeReclaimPolicy: Retain
  storageClassName: manual
  hostPath:
    path: /mnt/workspace_2/{{ .Release.Name }}-cache
  claimRef:
    namespace: {{ .Release.Namespace }}
    name: {{ .Release.Name }}-cache
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: {{ .Release.Name }}-cache
  labels:
    consumer-group: {{ .Release.Name }}
spec:
  accessModes: [ReadWriteMany]
  storageClassName: manual
  volumeName: {{ .Release.Name }}-cache-pv
  resources:
    requests:
      storage: {{ .Values.persistence.size }}
{{- end }}
