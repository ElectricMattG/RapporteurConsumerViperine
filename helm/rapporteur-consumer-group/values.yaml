image:
  registry: 192.168.1.3:5000
  repository: rapporteur-consumer-viperine
  tag: 0.2.0
  pullPolicy: Always

# No imagePullSecrets — local insecure registry needs no auth
imagePullSecrets: []

# 2026-08-02: "baby viper" minimal mode. When true:
#   - ONLY webScraper and deadLetterConsumer are deployed (summarizer and
#     summaryIndexer deployments are removed by helm upgrade, so no LLM
#     summarization cost can be incurred).
#   - The web-scraper (via WEB_SCRAPER_MINIMAL_MODE in the ConfigMap)
#     publishes ONLY to config.additionalOutputTopics (i.e. Gaboon) -
#     viperine.summarise-document and viperine.content-extracted receive
#     NOTHING, so no unconsumed backlog accumulates while the summarizer
#     is gone.
# Use case: chunk/Q&A-only backfills of URLs that already have summaries.
# Deploy with:    make k8s_deploy K8S_VERSION=<v> MINIMAL_MODE=true
# Restore full:   make k8s_deploy K8S_VERSION=<v>   (MINIMAL_MODE defaults false)
minimalMode: false

kafka:
  bootstrapServers: kafka-headless.kafka.svc.cluster.local:9092

# Postgres dual-write (summary-indexer only). The secret is pre-created
# cluster-wide (see Makefile k8s_prereqs) with a `dsn` key — the SAME secret
# Gaboon's index-aggregator uses, since both write to the same instance.
# Referenced as `optional: true` — if absent, PostgresSummaryClient falls back
# to its own config defaults and disables itself gracefully rather than crashing.
postgres:
  enabled: true
  secretName: gaboon-postgres-secret
  secretKey: dsn

# Shared non-secret configuration mounted as a ConfigMap and injected via envFrom.
# Any value here can be overridden per-consumer in consumers.<name>.env.
config:
  logLevel: INFO
  gcpProjectId: rapporteurclients
  # 2026-08-01: switched to global - gemini-3.5-flash (2.5-series is being
  # deprecated) is ONLY available via the global endpoint right now, 404s
  # on regional us-central1. The earlier global->us-central1 revert was
  # specifically to escape gemini-2.5-pro's exhausted regional-adjacent
  # Dynamic Shared Quota pool - not a blanket ban on global; re-evaluate if
  # 3.5-flash shows quota contention under sustained load.
  gcpLocation: global
  embeddingServiceUrl: http://embedding-service-serve-svc.default.svc.cluster.local:8000
  activeIndexFolder: x_indices_merged
  summarizerLlmProvider: gemini
  # Parallel-branch fan-out: other consumer groups (e.g. Gaboon's chunker) reuse
  # the SAME scraped content via this extra topic, no second scrape triggered.
  # Comma-separated; empty string disables fan-out.
  additionalOutputTopics: "gaboon.content-extracted"

persistence:
  enabled: true
  # PVC name will be {{ .Release.Name }}-cache; PV must be pre-created
  # (see k8s_prereqs in Makefile — pre-creates /mnt/workspace_2/viperine-cache)
  storageClass: manual
  volumeName: viperine-cache-pv    # must match the PV created by k8s_prereqs
  size: 20Gi
  mountPath: /app/cache

# Shared index folder — same host path the RAG pod mounts read-only.
# Consumers that write to the index (e.g. summaryIndexer) need RW access.
indices:
  enabled: true
  hostPath: /home/electric/workspace/RapporteurRAG/x_indices_merged
  mountPath: /app/x_indices_merged
  readOnly: false

gcpCredentials:
  enabled: true
  secretName: gcp-credentials      # exists in rag-service; copied to consumers by k8s_prereqs
  mountPath: /var/secrets/google
  fileName: key.json               # actual key name in the secret (not credentials.json)

# Azure is off — no azure-storage-secret exists in cluster; indexAggregator is disabled
azureStorage:
  enabled: false
  secretName: azure-storage-secret
  containerNames:
    indices: indices
    archive: research-archive
    sessionBackups: session-backups

nodeSelector: {}
tolerations: []

# Each key = a role in this group.
# Deployment/Service name: {{ .Release.Name }}-<role-kebabcase>
consumers:
  webScraper:
    enabled: true
    replicas: 1
    command: ["python", "-u", "src/consumers/kafka_web_scraper.py"]
    metricsPort: 8001
    resources:
      requests: { cpu: 400m, memory: 1Gi }
      limits:   { cpu: 1000m, memory: 3Gi }
    env: []

  summarizer:
    enabled: true
    replicas: 1
    command: ["python", "-u", "src/consumers/run_kafka_summarizer.py"]
    metricsPort: 8010
    resources:
      requests: { cpu: 400m, memory: 512Mi }
      limits:   { cpu: 1000m, memory: 2Gi }
    env: []

  summaryIndexer:
    enabled: true
    replicas: 1
    # Recreate prevents two pods from concurrently writing to the shared
    # research_summaries_combined.jsonl file during rolling updates.
    strategy:
      type: Recreate
    command: ["python", "-u", "src/consumers/run_kafka_summary_indexer.py"]
    metricsPort: 8006
    resources:
      requests: { cpu: 400m, memory: 512Mi }
      limits:   { cpu: 1000m, memory: 2Gi }
    env: []

  indexAggregator:
    enabled: false
    replicas: 1
    command: ["python", "-u", "src/consumers/run_kafka_index_aggregator.py"]
    metricsPort: 8008
    resources:
      requests: { cpu: 400m, memory: 700Mi }
      limits:   { cpu: 1000m, memory: 2Gi }
    env:
      - name: ENABLE_AGGREGATOR
        value: "true"

  deadLetterConsumer:
    enabled: true
    replicas: 1
    command: ["python", "-u", "src/consumers/run_kafka_dead_letter_consumer.py"]
    metricsPort: 8009
    resources:
      requests: { cpu: 200m, memory: 256Mi }
      limits:   { cpu: 500m, memory: 1Gi }
    env: []
