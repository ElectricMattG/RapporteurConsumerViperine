apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: {{ include "kafka.fullname" . }}
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "kafka.labels" . | nindent 4 }}
spec:
  serviceName: {{ include "kafka.fullname" . }}-headless
  replicas: {{ .Values.kafka.replicas }}
  selector:
    matchLabels:
      {{- include "kafka.selectorLabels" . | nindent 6 }}
  template:
    metadata:
      labels:
        {{- include "kafka.selectorLabels" . | nindent 8 }}
    spec:
      enableServiceLinks: false  # Prevent K8s from auto-injecting KAFKA_PORT env var
      {{- with .Values.imagePullSecrets }}
      imagePullSecrets:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      serviceAccountName: {{ include "kafka.serviceAccountName" . }}
      securityContext:
        {{- toYaml .Values.podSecurityContext | nindent 8 }}
      initContainers:
      - name: cleanup-lost-found
        image: busybox:latest
        command:
        - sh
        - -c
        - |
          echo "Cleaning up lost+found directory..."
          rm -rf /var/lib/kafka/data/lost+found
          echo "Cleanup complete"
        volumeMounts:
        - name: kafka-data
          mountPath: /var/lib/kafka/data
        securityContext:
          runAsUser: 0  # Need root to delete lost+found
          runAsNonRoot: false  # Allow root for this init container
      containers:
      # ZooKeeper sidecar (required for Kafka 7.5.0)
      - name: zookeeper
        image: confluentinc/cp-zookeeper:7.5.0
        imagePullPolicy: Always
        ports:
        - containerPort: 2181
          name: client
        env:
        - name: ZOOKEEPER_CLIENT_PORT
          value: "2181"
        - name: ZOOKEEPER_TICK_TIME
          value: "2000"
        - name: ZOOKEEPER_DATA_DIR
          value: "/var/lib/zookeeper/data"
        - name: ZOOKEEPER_DATA_LOG_DIR
          value: "/var/lib/zookeeper/log"
        volumeMounts:
        - name: zookeeper-data
          mountPath: /var/lib/zookeeper
        resources:
          {{- toYaml .Values.zookeeper.resources | nindent 10 }}
      - name: kafka
        image: {{ .Values.image.registry }}/{{ .Values.image.kafka.repository }}:{{ .Values.image.kafka.tag }}
        imagePullPolicy: {{ .Values.image.kafka.pullPolicy }}
        ports:
        - containerPort: 9092
          name: plaintext
        {{- if .Values.kafka.external.enabled }}
        - containerPort: 9094
          name: external
        {{- end }}
        env:
          # --- ZooKeeper Configuration ---
          - name: KAFKA_BROKER_ID
            value: "1"
          - name: KAFKA_ZOOKEEPER_CONNECT
            value: "localhost:2181"
          # --- Listener Configuration ---
          {{- if .Values.kafka.external.enabled }}
          - name: KAFKA_LISTENER_SECURITY_PROTOCOL_MAP
            value: "PLAINTEXT:PLAINTEXT,EXTERNAL:PLAINTEXT"
          - name: KAFKA_LISTENERS
            value: "PLAINTEXT://0.0.0.0:9092,EXTERNAL://0.0.0.0:9094"
          - name: KAFKA_ADVERTISED_LISTENERS
            value: "PLAINTEXT://{{ include "kafka.fullname" . }}-0.{{ include "kafka.fullname" . }}-headless.{{ .Release.Namespace }}.svc.cluster.local:9092,EXTERNAL://{{ .Values.ingress.externalIP }}:{{ .Values.kafka.external.service.port }}"
          - name: KAFKA_INTER_BROKER_LISTENER_NAME
            value: "PLAINTEXT"
          {{- else }}
          - name: KAFKA_LISTENER_SECURITY_PROTOCOL_MAP
            value: "PLAINTEXT:PLAINTEXT"
          - name: KAFKA_LISTENERS
            value: "PLAINTEXT://0.0.0.0:9092"
          - name: KAFKA_ADVERTISED_LISTENERS
            value: "PLAINTEXT://{{ include "kafka.fullname" . }}-0.{{ include "kafka.fullname" . }}-headless.{{ .Release.Namespace }}.svc.cluster.local:9092"
          {{- end }}
          # --- Storage ---
          - name: KAFKA_LOG_DIRS
            value: "/var/lib/kafka/data"
          # --- Additional Configuration ---
          - name: KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR
            value: {{ .Values.kafka.config.offsetsTopicReplicationFactor | quote }}
          - name: KAFKA_TRANSACTION_STATE_LOG_MIN_ISR
            value: {{ .Values.kafka.config.transactionStateLogMinIsr | quote }}
          - name: KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR
            value: {{ .Values.kafka.config.transactionStateLogReplicationFactor | quote }}
          - name: KAFKA_AUTO_CREATE_TOPICS_ENABLE
            value: {{ .Values.kafka.config.autoCreateTopicsEnable | quote }}
          - name: KAFKA_LOG_RETENTION_HOURS
            value: {{ .Values.kafka.config.logRetentionHours | quote }}
          - name: KAFKA_NUM_PARTITIONS
            value: {{ .Values.kafka.config.numPartitions | quote }}
          - name: KAFKA_DEFAULT_REPLICATION_FACTOR
            value: {{ .Values.kafka.config.defaultReplicationFactor | quote }}
        volumeMounts:
        - name: kafka-data
          mountPath: /var/lib/kafka/data
        resources:
          {{- toYaml .Values.kafka.resources | nindent 10 }}
        {{- if .Values.livenessProbe.kafka.enabled }}
        livenessProbe:
          exec:
            command:
            - sh
            - -c
            - kafka-broker-api-versions --bootstrap-server localhost:9092
          initialDelaySeconds: {{ .Values.livenessProbe.kafka.initialDelaySeconds }}
          periodSeconds: {{ .Values.livenessProbe.kafka.periodSeconds }}
          timeoutSeconds: {{ .Values.livenessProbe.kafka.timeoutSeconds }}
          failureThreshold: {{ .Values.livenessProbe.kafka.failureThreshold }}
        {{- end }}
        {{- if .Values.readinessProbe.kafka.enabled }}
        readinessProbe:
          exec:
            command:
            - sh
            - -c
            - kafka-broker-api-versions --bootstrap-server localhost:9092
          initialDelaySeconds: {{ .Values.readinessProbe.kafka.initialDelaySeconds }}
          periodSeconds: {{ .Values.readinessProbe.kafka.periodSeconds }}
          timeoutSeconds: {{ .Values.readinessProbe.kafka.timeoutSeconds }}
          failureThreshold: {{ .Values.readinessProbe.kafka.failureThreshold }}
        {{- end }}
      {{- with .Values.nodeSelector }}
      nodeSelector:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.tolerations }}
      tolerations:
        {{- toYaml . | nindent 8 }}
      {{- end }}
  volumeClaimTemplates:
  - metadata:
      name: kafka-data
    spec:
      accessModes:
        - {{ .Values.kafka.persistence.accessMode }}
      storageClassName: {{ .Values.kafka.persistence.storageClass }}
      resources:
        requests:
          storage: {{ .Values.kafka.persistence.size }}
  - metadata:
      name: zookeeper-data
    spec:
      accessModes:
        - {{ .Values.zookeeper.persistence.accessMode }}
      storageClassName: {{ .Values.zookeeper.persistence.storageClass }}
      resources:
        requests:
          storage: {{ .Values.zookeeper.persistence.size }}
