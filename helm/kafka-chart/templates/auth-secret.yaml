{{- if and .Values.ingress.enabled .Values.ingress.auth.enabled .Values.ingress.auth.createSecret }}
apiVersion: v1
kind: Secret
metadata:
  name: {{ .Values.ingress.auth.secretName }}
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "kafka.labels" . | nindent 4 }}
type: Opaque
data:
  # Format: username:htpasswd_hash
  # Generate with: htpasswd -nb username password | base64
  # Default: kafka:kafka123 (change this in production!)
  auth: {{ .Values.ingress.auth.htpasswd | b64enc }}
{{- end }}
