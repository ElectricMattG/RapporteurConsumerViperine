{{- if .Values.kafka.external.enabled }}
apiVersion: v1
kind: Service
metadata:
  name: {{ include "kafka.fullname" . }}-external
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "kafka.labels" . | nindent 4 }}
    service-type: external
  {{- with .Values.kafka.external.service.annotations }}
  annotations:
    {{- toYaml . | nindent 4 }}
  {{- end }}
spec:
  type: {{ .Values.kafka.external.service.type }}
  {{- if and (eq .Values.kafka.external.service.type "LoadBalancer") .Values.kafka.external.service.loadBalancerIP }}
  loadBalancerIP: {{ .Values.kafka.external.service.loadBalancerIP }}
  {{- end }}
  ports:
    - name: kafka-external
      port: {{ .Values.kafka.external.service.port }}
      targetPort: 9094
      protocol: TCP
      {{- if and (eq .Values.kafka.external.service.type "NodePort") .Values.kafka.external.service.nodePort }}
      nodePort: {{ .Values.kafka.external.service.nodePort }}
      {{- end }}
  selector:
    {{- include "kafka.selectorLabels" . | nindent 4 }}
    statefulset.kubernetes.io/pod-name: {{ include "kafka.fullname" . }}-0
{{- end }}
