# Default values for kafka deployment with ZooKeeper sidecar

# Image configuration
image:
  registry: ragserviceneacr6881.azurecr.io
  kafka:
    repository: kafka
    tag: "8.0.0"
    pullPolicy: Always

imagePullSecrets: []
nameOverride: ""
fullnameOverride: ""

# Kafka configuration
kafka:
  replicas: 1  # Single replica for kafkapool (1 node available)

  # Kafka broker configuration
  config:
    brokerId: 0
    offsetsTopicReplicationFactor: 1  # Single replica
    transactionStateLogMinIsr: 1  # Single replica
    transactionStateLogReplicationFactor: 1  # Single replica
    groupInitialRebalanceDelayMs: 0
    autoCreateTopicsEnable: "true"
    logRetentionHours: 168  # 7 days
    logSegmentBytes: 1073741824  # 1GB
    numPartitions: 12
    defaultReplicationFactor: 1  # Single replica

  # Resource limits (adjusted for kafkapool: 2 cores, ~6GB allocatable)
  resources:
    requests:
      memory: "1Gi"
      cpu: "500m"
    limits:
      memory: "2Gi"
      cpu: "1000m"

  # Persistent volume configuration
  persistence:
    enabled: true
    storageClass: "managed-csi"  # Standard LRS for Standard_D2_v3
    size: 50Gi  # Reduced for kafkapool deployment
    accessMode: ReadWriteOnce

# ZooKeeper sidecar configuration
zookeeper:
  # Resource limits for sidecar (adjusted for kafkapool)
  resources:
    requests:
      memory: "256Mi"
      cpu: "200m"
    limits:
      memory: "512Mi"
      cpu: "400m"

  # Persistent volume configuration
  persistence:
    enabled: true
    storageClass: "managed-csi"  # Standard LRS for Standard_D2_v3
    size: 10Gi  # Reduced for kafkapool deployment
    accessMode: ReadWriteOnce

# Service configuration
service:
  type: ClusterIP
  kafka:
    port: 9092
    internalPort: 9093
  zookeeper:
    port: 2181
  annotations: {}

# Pod configuration
podAnnotations: {}
podSecurityContext:
  fsGroup: 1000
  runAsUser: 1000
  runAsNonRoot: true

securityContext:
  allowPrivilegeEscalation: false
  capabilities:
    drop:
    - ALL
  readOnlyRootFilesystem: false

# Anti-affinity to spread pods across nodes
affinity:
  podAntiAffinity:
    requiredDuringSchedulingIgnoredDuringExecution:
      - labelSelector:
          matchExpressions:
            - key: app.kubernetes.io/name
              operator: In
              values:
                - kafka
        topologyKey: kubernetes.io/hostname

# Tolerations - Allow scheduling on kafkapool with workload taint
tolerations:
  - key: "workload"
    operator: "Equal"
    value: "kafka"
    effect: "NoSchedule"

# Node selector - Deploy to kafkapool
nodeSelector:
  agentpool: kafkapool

# Service account
serviceAccount:
  create: true
  annotations: {}
  name: ""

# Monitoring
metrics:
  enabled: true
  jmxExporter:
    port: 5556

# Health checks
livenessProbe:
  kafka:
    enabled: true
    initialDelaySeconds: 60
    periodSeconds: 10
    timeoutSeconds: 5
    failureThreshold: 6
  zookeeper:
    enabled: true
    initialDelaySeconds: 30
    periodSeconds: 10
    timeoutSeconds: 5
    failureThreshold: 6

readinessProbe:
  kafka:
    enabled: true
    initialDelaySeconds: 30
    periodSeconds: 10
    timeoutSeconds: 5
    failureThreshold: 6
  zookeeper:
    enabled: true
    initialDelaySeconds: 20
    periodSeconds: 10
    timeoutSeconds: 5
    failureThreshold: 6
